<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>日本に行きたい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Concept: a metro map for Japanese. Each deck is a colour-coded line, every entry carries a station-style code. */
:root {
  --bg: #EEF1F6; --card: #FFFFFF; --ink: #13203D; --muted: #566182; --line: #D4DAE6; --soft: #E3E8F1; --soft2: #F5F7FB;
  --btn: #13203D; --btn-ink: #FFFFFF; --focus: #0A8FC1;
  --c-hira: #E8860C; --c-kata: #0A8FC1; --c-kanji: #7A5BD6; --c-vocab: #1C9A55; --c-phrase: #D7413F;
  --good: #1C8A4E; --good-bg: #DCF2E5; --bad: #C93434; --bad-bg: #FBE2E2;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, system-ui, sans-serif;
  --f-disp: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --glyph: 'Klee One', 'Yu Kyokasho', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1324; --card: #161F36; --ink: #E9EDF7; --muted: #9AA6C4; --line: #2A3656; --soft: #1F2A47; --soft2: #121A2E;
    --btn: #E9EDF7; --btn-ink: #0D1324; --focus: #3FB6E8;
    --c-hira: #F5A23A; --c-kata: #3FB6E8; --c-kanji: #A28BFF; --c-vocab: #43C583; --c-phrase: #F2706E;
    --good: #4CCB86; --good-bg: #153424; --bad: #F2706E; --bad-bg: #3A1B1E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1324; --card: #161F36; --ink: #E9EDF7; --muted: #9AA6C4; --line: #2A3656; --soft: #1F2A47; --soft2: #121A2E;
  --btn: #E9EDF7; --btn-ink: #0D1324; --focus: #3FB6E8;
  --c-hira: #F5A23A; --c-kata: #3FB6E8; --c-kanji: #A28BFF; --c-vocab: #43C583; --c-phrase: #F2706E;
  --good: #4CCB86; --good-bg: #153424; --bad: #F2706E; --bad-bg: #3A1B1E; color-scheme: dark;
}
:root[data-font="gothic"] { --glyph: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
:root[data-font="mincho"] { --glyph: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-body); }
body.noscroll { overflow: hidden; }
#app { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 56px; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 4.4vw, 2.25rem); letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; } h4 { font-size: 1rem; margin: 18px 0 8px; }
p { margin: 0 0 10px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.glyph { font-family: var(--glyph); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: .82rem; } .ctr { text-align: center; justify-content: center; } .mt { margin-top: 14px; }
.eyebrow { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.dotc { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); display: inline-block; flex: none; }
.lab { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; display: block; }
.lab:first-child { margin-top: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
kbd { font: 500 .7rem var(--f-mono); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; opacity: .65; }

/* header + nav */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.mark { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--c-hira); display: grid; place-items: center; font: 700 1.1rem var(--f-disp); background: var(--card); }
.bt { display: flex; flex-direction: column; line-height: 1.1; }
.bt b { font: 700 1.3rem var(--f-disp); } .bt small { font: 500 .6rem var(--f-mono); letter-spacing: .14em; color: var(--muted); margin-top: 3px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; line-height: 1.15; border-bottom: 3px solid transparent; }
.nav .k { font: 700 1rem var(--f-disp); } .nav .e { font: 500 .62rem var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.nav a:hover { background: var(--soft); } .nav a.on { border-bottom-color: var(--ink); background: var(--soft); }
#chips { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.stat { font: 500 .74rem var(--f-mono); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.stat b { color: var(--ink); }
@media (min-width: 900px) { #chips { width: auto; } }
@media (max-width: 760px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; background: var(--card); border-top: 2px solid var(--ink); justify-content: space-between; gap: 0;
    padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .nav a { flex: 1; padding: 6px 2px; border-bottom: 0; border-top: 3px solid transparent; border-radius: 0; }
  .nav a.on { border-top-color: var(--ink); }
  #app { padding-block: 14px 96px; }
}

/* generic */
.page { display: flex; flex-direction: column; gap: 16px; }
.ph { margin-bottom: 4px; } .sub { color: var(--muted); max-width: 62ch; margin-top: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card > h2 { margin-bottom: 10px; } .card.tip { background: var(--soft2); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--btn); color: var(--btn-ink); border: 1.5px solid var(--btn); border-radius: 8px; padding: 9px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); } .btn.ghost:hover:not(:disabled) { border-color: var(--ink); filter: none; }
.btn.lg { padding: 13px 20px; font-size: 1.02rem; } .btn.sm { padding: 3px 10px; font-size: .8rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.link { background: none; border: 0; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 13px; font-size: .86rem; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--ink); } .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; padding: 10px 16px; font-weight: 700; border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; color: var(--muted); --c: var(--ink); }
.tab:hover { color: var(--ink); } .tab.on { color: var(--ink); border-bottom-color: var(--c); }
.ibtn { background: none; border: 1.5px solid var(--line); border-radius: 8px; width: 38px; height: 38px; display: inline-grid; place-items: center; flex: none; }
.ibtn:hover { border-color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
.prog { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: 1; }
.prog i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .3s; } .prog.thin { height: 6px; }
.seg { height: 8px; background: var(--soft); border-radius: 99px; display: flex; overflow: hidden; width: 100%; }
.seg i { height: 100%; background: var(--c); } .seg .s2 { opacity: .6; } .seg .s1 { opacity: .3; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats3 > div, .stat4 .sc { background: var(--soft2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; }
.stats3 b, .sc b { display: block; font: 700 1.6rem/1.1 var(--f-mono); } .stats3 span, .sc span { font-size: .78rem; color: var(--muted); }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } .stat4 .sc { background: var(--card); }
@media (max-width: 560px) { .stat4 { grid-template-columns: repeat(2, 1fr); } }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .cols2 > * { min-width: 0; }
@media (max-width: 760px) { .cols2 { grid-template-columns: 1fr; } }
.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.sech { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
textarea, input[type=search], .gin { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; }
.anout { font: 400 .8rem/1.4 var(--f-mono); margin-top: 8px; resize: vertical; }

/* dex */
.deckbar { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 10px; padding: 14px 16px; }
.deckinfo { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toolbar .chips { margin: 0; } .search { flex: 1 1 240px; max-width: 420px; }
.kgroup { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.kh { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 4px; } .kh span { color: var(--muted); font-size: .84rem; }
.kgrid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 8px; }
.kgrid.kj { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.cell { --c: var(--c-hira); position: relative; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 18px 4px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; transition: transform .12s; }
.cell:hover { transform: translateY(-2px); border-color: var(--ink); border-left-color: var(--c); }
.cell .glyph { font-size: clamp(1.5rem, 5.6vw, 2.2rem); line-height: 1.1; opacity: .55; }
.cell.kj .glyph { font-size: 2rem; }
.cell .cap { font: 500 .72rem var(--f-mono); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .code { position: absolute; top: 3px; left: 6px; font: 500 .6rem var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.cell .n5 { position: absolute; top: 3px; right: 5px; font: 500 .58rem var(--f-mono); color: var(--muted); }
.cell.l1 { background: color-mix(in srgb, var(--c) 10%, var(--card)); } .cell.l1 .glyph { opacity: .85; }
.cell.l2 { background: color-mix(in srgb, var(--c) 20%, var(--card)); } .cell.l2 .glyph { opacity: 1; }
.cell.l3 { background: color-mix(in srgb, var(--c) 32%, var(--card)); } .cell.l3 .glyph { opacity: 1; }
.cell.l3::after { content: ''; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cell.dim { opacity: .28; } .gap { display: block; }
.look { display: flex; gap: 10px 18px; flex-wrap: wrap; margin-top: 8px; } .look span { display: inline-flex; gap: 4px; align-items: baseline; font-size: 1.6rem; } .look i { color: var(--muted); font-style: normal; font-size: 1rem; }
.vlist, .plist { display: flex; flex-direction: column; gap: 6px; }
.vrow, .pcard { display: flex; gap: 8px; align-items: stretch; }
.vmain, .pmain { flex: 1; min-width: 0; text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c-vocab); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px 14px; }
.vmain { grid-template-columns: minmax(80px, 1.1fr) minmax(90px, 1fr) 1.4fr; align-items: center; }
@media (max-width: 560px) { .vmain { grid-template-columns: 1fr 1fr; } .vmean { grid-column: 1 / -1; } }
.vmain:hover, .pmain:hover { border-color: var(--ink); border-left-color: var(--c-vocab); }
.pmain { border-left-color: var(--c-phrase); } .pmain:hover { border-left-color: var(--c-phrase); }
.vjp { font: 700 1.25rem var(--glyph); } .vmid { display: flex; flex-direction: column; line-height: 1.25; } .vrd { font-size: .92rem; } .vro, .pro { font: 400 .75rem var(--f-mono); color: var(--muted); } .vmean, .pen { color: var(--muted); font-size: .9rem; }
.pjp { font: 700 1.15rem var(--glyph); display: block; }
.vrow.l1 .vmain, .pcard.l1 .pmain { background: color-mix(in srgb, var(--c-vocab) 9%, var(--card)); }
.vrow.l2 .vmain { background: color-mix(in srgb, var(--c-vocab) 18%, var(--card)); } .vrow.l3 .vmain { background: color-mix(in srgb, var(--c-vocab) 30%, var(--card)); }
.pcard.l1 .pmain { background: color-mix(in srgb, var(--c-phrase) 9%, var(--card)); } .pcard.l2 .pmain { background: color-mix(in srgb, var(--c-phrase) 18%, var(--card)); } .pcard.l3 .pmain { background: color-mix(in srgb, var(--c-phrase) 30%, var(--card)); }

/* modal */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 24, .62); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 520px; padding: 22px; position: relative; margin: auto; }
.dlg .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 1.4rem; line-height: 1; }
.big { font-size: clamp(4.5rem, 20vw, 7rem); line-height: 1.1; text-align: center; margin: 6px 0; } .big.two { font-size: clamp(3.5rem, 15vw, 5.5rem); } .big.txt { font: 700 clamp(1.8rem, 7vw, 2.6rem)/1.25 var(--glyph); }
.rom { font: 700 1.5rem var(--f-disp); text-align: center; margin: 0 0 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0; } .kv dt { color: var(--muted); font: 500 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; } .kv dd { margin: 0; }
.exl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.exl li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .exl li b { font: 700 1.1rem var(--glyph); } .exl li span { color: var(--muted); } .exl li i { font-style: normal; color: var(--muted); }
.pad { position: relative; width: min(100%, 320px); aspect-ratio: 1; margin: 6px auto 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--soft2);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 50% 50%; background-position: center; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.padg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15rem; line-height: 1; opacity: .13; pointer-events: none; overflow: hidden; } .padg.two { font-size: 8rem; }
.pad.hide .padg { display: none; }

/* study */
.sess { display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto; width: 100%; }
.sbar { display: flex; align-items: center; gap: 12px; font: 500 .8rem var(--f-mono); }
.flash { --c: var(--c-hira); position: relative; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 10px; padding: 22px 18px; text-align: center; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.flash .eyebrow { justify-content: center; } .flash hr { width: 60%; } .flash .rd { font: 700 1.1rem var(--glyph); margin: 0 0 6px; }
.flash .sp { position: absolute; right: 12px; top: 12px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gbtn { background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.gbtn b { font-size: .95rem; } .gbtn span { font: 400 .7rem var(--f-mono); color: var(--muted); } .gbtn kbd { margin: 2px 0 0; }
.gbtn.g0 { border-color: var(--bad); } .gbtn.g1 { border-color: var(--c-hira); } .gbtn.g2 { border-color: var(--c-vocab); } .gbtn.g3 { border-color: var(--c-kata); } .gbtn:hover { background: var(--soft); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 8px; min-height: 52px; min-width: 0; overflow-wrap: anywhere; }
.opt kbd { margin: 0; } .opt:hover:not(:disabled) { border-color: var(--ink); } .opt .gl { font-size: 1.8rem; line-height: 1.1; }
.opt.ok { border-color: var(--good); background: var(--good-bg); } .opt.bad { border-color: var(--bad); background: var(--bad-bg); } .opt.off { opacity: .55; } .opt:disabled { cursor: default; }
.fb { border-radius: 8px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--soft2); border: 1px solid var(--line); }
.fb.ok { background: var(--good-bg); border-color: var(--good); } .fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.setup .chips { margin-bottom: 4px; } .setup .btn.lg { margin-top: 14px; }
.card.done { max-width: 640px; margin: 0 auto; width: 100%; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.lcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c-vocab); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.lcard:hover { border-color: var(--ink); border-left-color: var(--c-vocab); } .lcard .ljp { font: 700 1.5rem var(--f-disp); } .lcard .lt { font-weight: 700; } .lcard .ls { font: 500 .72rem var(--f-mono); color: var(--muted); text-transform: uppercase; }
.lcard.done { background: color-mix(in srgb, var(--c-vocab) 14%, var(--card)); }
.lesson { max-width: 720px; display: flex; flex-direction: column; gap: 8px; } .prose ul { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }

<script>
'use strict';
/* ============ DATA ============ */
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

/* ---- Kana (rows split by |, cells split by space, _ = gap) ---- */
const KANA_SPEC = {
  basic: ['Gojūon', 'The 46 basic sounds', 5,
    'あ い う え お|か き く け こ|さ し す せ そ|た ち つ て と|な に ぬ ね の|は ひ ふ へ ほ|ま み む め も|や _ ゆ _ よ|ら り る れ ろ|わ _ _ _ を|ん _ _ _ _',
    'a i u e o|ka ki ku ke ko|sa shi su se so|ta chi tsu te to|na ni nu ne no|ha hi fu he ho|ma mi mu me mo|ya _ yu _ yo|ra ri ru re ro|wa _ _ _ wo|n _ _ _ _'],
  dakuten: ['Dakuten', 'Voiced sounds, marked with ゛', 5,
    'が ぎ ぐ げ ご|ざ じ ず ぜ ぞ|だ ぢ づ で ど|ば び ぶ べ ぼ',
    'ga gi gu ge go|za ji zu ze zo|da ji zu de do|ba bi bu be bo'],
  handakuten: ['Handakuten', 'The p-sounds, marked with ゜', 5,
    'ぱ ぴ ぷ ぺ ぽ', 'pa pi pu pe po'],

    'kya kyu kyo|sha shu sho|cha chu cho|nya nyu nyo|hya hyu hyo|mya myu myo|rya ryu ryo|gya gyu gyo|ja ju jo|bya byu byo|pya pyu pyo']
};
const KATA_EXT = ['Extended', 'Extra sounds for foreign words', 5,
  'ファ フィ フェ フォ _|ティ ディ _ _ _|ウィ ウェ ウォ _ _|シェ チェ ジェ _ _|ヴ _ _ _ _',
  'fa fi fe fo _|ti di _ _ _|wi we wo _ _|she che je _ _|vu _ _ _ _'];

const ALT = { shi: ['si'], chi: ['ti'], tsu: ['tu'], fu: ['hu'], ji: ['zi'], wo: ['o'], sha: ['sya'], shu: ['syu'], sho: ['syo'],
  cha: ['tya', 'cya'], chu: ['tyu', 'cyu'], cho: ['tyo', 'cyo'], ja: ['jya', 'zya'], ju: ['jyu', 'zyu'], jo: ['jyo', 'zyo'], n: ['nn'] };
function accepted(it) {
  const a = [it.ro].concat(ALT[it.ro] || []);
  if ('ぢヂ'.includes(it.ch)) a.push('di');
  if ('づヅ'.includes(it.ch)) a.push('du');
  return a;
}

const KANA = [];            // flat list of every kana item
const KANA_TABLE = { h: [], k: [] };   // [{key,title,sub,cols,rows:[[item|null]]}]
(function buildKana() {
  ['h', 'k'].forEach(type => {
    let n = 0;
    const groups = Object.keys(KANA_SPEC).map(k => [k].concat(KANA_SPEC[k]));
    if (type === 'k') groups.push(['ext'].concat(KATA_EXT));
    groups.forEach(([key, title, sub, cols, jp, ro]) => {
      const jr = jp.split('|'), rr = ro.split('|');
      const rows = jr.map((row, ri) => row.split(' ').map((ch, ci) => {
        if (ch === '_') return null;
        n++;
        const it = { id: type + ':' + (type === 'k' ? toKata(ch) : ch), type, ch: type === 'k' ? toKata(ch) : ch,
          ro: rr[ri].split(' ')[ci], group: key, n };
        KANA.push(it);
        return it;
      }));
      KANA_TABLE[type].push({ key, title, sub, cols, rows });
    });
  });
})();

/* romaji from kana reading (hiragana or katakana) */
const HMAP = {};
KANA.filter(i => i.type === 'h').forEach(i => { HMAP[i.ch] = i.ro; });
const RO_FIX = { 'こんにちは': 'konnichiwa', 'こんばんは': 'konbanwa' };
function romaji(str) {
  if (RO_FIX[str]) return RO_FIX[str];
  const s = toHira(str);
  const look = i => HMAP[s.substr(i, 2)] ? [HMAP[s.substr(i, 2)], 2] : HMAP[s[i]] ? [HMAP[s[i]], 1] : null;
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === 'っ') { const nx = look(i + 1); if (nx) out += nx[0].startsWith('ch') ? 't' : nx[0][0]; continue; }
    if (c === 'ー') { out = out.replace(/[aiueo]$/, m => ({ a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' })[m]); continue; }
    const two = look(i);
    if (two) {
      let r = two[0];
      if (c === 'ん') { const nx = look(i + 1); if (nx && /^[aiueoy]/.test(nx[0])) r = "n'"; }
      out += r; i += two[1] - 1; continue;
    }
    out += c;
  }
  return out;
}

const pad2 = n => String(n).padStart(2, '0');
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const dayKey = d => { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

  set: { goal: 30, romaji: true, sound: true, speak: true, font: 'klee', theme: 'system' } });

  } catch (e) { /* storage unavailable: run in memory */ }
}
let saveT;
function save() { S.saved = Date.now(); if (typeof cloudDirty === 'function') cloudDirty(); clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 200); }

/* ---- item state & spaced repetition ---- */
const DAY = 864e5, GAP = [0, 1, 3, 7, 14, 30];
const peek = id => S.items[id] || { b: 0, due: 0, c: 0, w: 0, s: 0 };
const ref = id => S.items[id] || (S.items[id] = { b: 0, due: 0, c: 0, w: 0, s: 0 });
const lvl = id => { const x = peek(id); return x.b >= 5 ? 3 : x.b >= 3 ? 2 : (x.b >= 1 || x.s > 0) ? 1 : 0; };
const LVL_NAME = ['New', 'Learning', 'Familiar', 'Mastered'];

function today() { const k = dayKey(); return S.days[k] || (S.days[k] = { xp: 0, rev: 0, learn: 0, games: 0, ok: 0, all: 0, met: false }); }
function tally(ok) { S.tot.all++; const d = today(); d.all++; if (ok) { S.tot.ok++; d.ok++; } }
function addXP(n) {
  if (!n) return;
  const d = today(); d.xp += n; S.xp += n;
  if (!d.met && d.xp >= S.set.goal) { d.met = true; toast('Daily goal reached'); sfx.win(); }
  checkAch(); refreshChips(); save();
}
/* g: 0 again, 1 hard, 2 good, 3 easy. Returns true when the item was new. */
function grade(id, g) {
  const x = ref(id), now = Date.now(), first = x.s === 0;
  x.s++;
  if (g === 0) { x.w++; x.b = Math.max(0, x.b - 1); x.due = now + 10 * 60e3; tally(false); }
  else {
    x.c++;
    if (g === 1) { x.b = Math.max(1, x.b); x.due = now + Math.max(36e5, GAP[x.b] * DAY * 0.5); }
    else { x.b = Math.min(5, x.b + (g === 3 ? 2 : 1)); x.due = now + GAP[x.b] * DAY; }
    tally(true);
  }
  const d = today(); if (first) d.learn++; else d.rev++;
  addXP(g + (first && g > 0 ? 1 : 0));
  return first;
}
/* lighter update used by quizzes and games */
function touch(id, ok) {
  const x = ref(id), now = Date.now(), first = x.s === 0;
  x.s++;
  if (ok) { x.c++; if (x.b === 0) { x.b = 1; x.due = now + DAY; } else if (x.due <= now) { x.b = Math.min(5, x.b + 1); x.due = now + GAP[x.b] * DAY; } }
  else { x.w++; if (x.b > 1) x.b--; x.due = now + 10 * 60e3; }
  tally(ok); if (first) today().learn++;
  save();
}
function markKnown(id) { const x = ref(id); x.b = 5; x.s = Math.max(1, x.s); x.due = Date.now() + 30 * DAY; save(); checkAch(); }
function resetItem(id) { delete S.items[id]; save(); }

const poolOf = deck => (deck && deck !== 'all') ? DECKS[deck].items : ALL;
const dueList = deck => poolOf(deck).filter(i => { const x = S.items[i.id]; return x && x.s > 0 && x.due <= Date.now(); }).sort((a, b) => S.items[a.id].due - S.items[b.id].due);
const newList = deck => poolOf(deck).filter(i => { const x = S.items[i.id]; return !x || (x.s === 0 && x.b === 0); });
const deckStat = key => { const r = [0, 0, 0, 0]; DECKS[key].items.forEach(i => r[lvl(i.id)]++); return r; };
const cnt = (deck, min) => DECKS[deck].items.filter(i => lvl(i.id) >= min).length;

function levelInfo() { const l = Math.floor(Math.sqrt(S.xp / 30)) + 1, lo = 30 * (l - 1) * (l - 1), hi = 30 * l * l; return { l, lo, hi, p: (S.xp - lo) / (hi - lo) }; }
function streak() {
  let n = 0; const d = new Date();
  if (!(S.days[dayKey(d)] || {}).met) d.setDate(d.getDate() - 1);
  while ((S.days[dayKey(d)] || {}).met) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

let toastT;

let AC;
function beep(f, d, type, v) {
  if (!S.set.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.value = v || 0.05;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  } catch (e) {}
}

const passFilter = it => { const L = lvl(it.id), f = UI.dexFilter; return f === 'all' || (f === 'new' && L === 0) || (f === 'learning' && (L === 1 || L === 2)) || (f === 'mastered' && L === 3); };

function viewDex() {
  return `<section class="page">
    <header class="ph"><p class="eyebrow">図鑑 · Dex</p><h1>Every character, one entry each</h1>

}
function dexBody() {

const cellHTML = it => {
  const L = lvl(it.id), kana = isKana(it);

    <span class="cap">${kana ? (S.set.romaji ? esc(it.ro) : '&nbsp;') : esc(it.mean)}</span>${it.n5 ? '<span class="n5">N5</span>' : ''}</button>`;
};
function dexList() {
  const k = UI.dex, q = UI.dexQ.trim().toLowerCase();
  if (k === 'hira' || k === 'kata') {
    const type = k === 'hira' ? 'h' : 'k';
    let h = KANA_TABLE[type].map(g => `<div class="kgroup"><div class="kh"><h3>${g.title}</h3><span>${g.sub}</span></div>
      <div class="kgrid" style="--cols:${g.cols}">${g.rows.map(r => r.map(it => it ? cellHTML(it) : '<span class="gap"></span>').join('')).join('')}</div></div>`).join('');
    const pairs = type === 'h' ? [['ぬ', 'め'], ['わ', 'れ', 'ね'], ['は', 'ほ'], ['る', 'ろ'], ['さ', 'き'], ['い', 'り'], ['あ', 'お']]
      : [['シ', 'ツ'], ['ソ', 'ン'], ['ノ', 'メ'], ['ヌ', 'ス'], ['ウ', 'ワ'], ['ク', 'ケ'], ['コ', 'ユ']];
    return h + `<div class="card tip"><h3>Easy to mix up</h3><p class="muted">These sets look alike. Check the stroke direction and the angle before you answer.</p>
      <div class="look">${pairs.map(p => `<span>${p.map(c => `<b class="glyph">${c}</b>`).join('<i>/</i>')}</span>`).join('')}</div></div>`;
  }
  if (k === 'kanji') {
    const list = KANJI.filter(j => (UI.dexCat === 'all' || j.cat === UI.dexCat) && passFilter(j) &&
      (!q || j.ch.includes(q) || j.mean.toLowerCase().includes(q) || kanjiRead(j).includes(q) || j.ex.some(e => e.w.includes(q) || e.r.includes(q) || e.m.toLowerCase().includes(q))));

    return KANJI_CATS.filter(c => list.some(j => j.cat === c[0])).map(c => `<div class="kgroup"><div class="kh"><h3>${c[1]}</h3><span>${list.filter(j => j.cat === c[0]).length} kanji</span></div>
      <div class="kgrid kj" style="--cols:5">${list.filter(j => j.cat === c[0]).map(cellHTML).join('')}</div></div>`).join('') +
      `<p class="muted small">N5 marks the official JLPT N5 kanji. All 103 are included. The other ${KANJI.filter(j => !j.n5).length} are common extras. Meanings and readings checked against online kanji lists.</p>`;
  }
  if (k === 'vocab') {
    const list = VOCAB.filter(v => (UI.vocCat === 'all' || v.cat === UI.vocCat) && passFilter(v) &&
      (!q || v.ch.includes(q) || v.rd.includes(q) || v.ro.includes(q) || v.mean.toLowerCase().includes(q)));
    if (!list.length) return '<p class="empty">No words match. Clear the search or the filter.</p>';
    return `<div class="vlist">${list.map(v => `<div class="vrow l${lvl(v.id)}"><button class="vmain" data-act="detail" data-id="${esc(v.id)}">
      <span class="vjp">${esc(v.ch)}</span><span class="vmid"><span class="vrd">${esc(v.rd)}</span><span class="vro">${esc(v.ro)}</span></span><span class="vmean">${esc(v.mean)}</span></button>
      <button class="ibtn" data-act="say" data-id="${esc(v.id)}" aria-label="Listen to ${esc(v.rd)}">${SPEAK_SVG}</button></div>`).join('')}</div>`;

    <div class="pcard l${lvl(p.id)}"><button class="pmain" data-act="detail" data-id="${p.id}"><span class="pjp">${esc(p.ch)}</span><span class="pro">${esc(p.ro)}</span><span class="pen">${esc(p.mean)}</span></button>
    <button class="ibtn" data-act="say" data-id="${p.id}" aria-label="Listen">${SPEAK_SVG}</button></div>`).join('')}</div></div>`).join('');
}

/* ---- detail dialog ---- */
function fmtDue(x) {
  if (!x.s) return 'Not studied yet';
  const df = x.due - Date.now();
  if (df <= 0) return 'Due for review now';
  if (df < 36e5) return 'Next review in ' + Math.max(1, Math.round(df / 6e4)) + ' min';
  if (df < DAY) return 'Next review in ' + Math.round(df / 36e5) + ' h';
  return 'Next review in ' + Math.round(df / DAY) + ' days';
}
function openDetail(id) {

    const other = it.type === 'h' ? toKata(it.ch) : toHira(it.ch);

      ${words.length ? `<h4>Words that start with ${esc(it.ch)}</h4><ul class="exl">${words.map(w => `<li><b>${esc(w.ch)}</b> <span>${esc(w.rd)}</span> <i>${esc(w.mean)}</i></li>`).join('')}</ul>` : ''}`;

  } else {

      ${ks.length ? `<h4>Kanji inside</h4><div class="chips">${ks.map(c => `<button class="chip" data-act="detail" data-id="j:${c}"><span class="glyph">${c}</span> ${esc(KANJI_BY_CH[c].mean)}</button>`).join('')}</div>` : ''}`;

  openModal(`<button class="x" data-act="closeModal" aria-label="Close">×</button>
    <p class="eyebrow" style="--c:var(${colorOf(it)})"><span class="dotc"></span>${codeOf(it)} · ${TYPE_NAME[it.type]} · ${LVL_NAME[L]}</p>${body}
    <div class="row mt"><button class="btn" data-act="say" data-id="${esc(id)}">${SPEAK_SVG} Listen</button>
      ${L < 3 ? `<button class="btn ghost" data-act="known" data-id="${esc(id)}">I already know this</button>` : ''}
      ${x.s ? `<button class="btn ghost" data-act="resetItem" data-id="${esc(id)}">Reset progress</button>` : ''}</div>
    <p class="muted small">${fmtDue(x)}${x.s ? ` · ${x.c} correct, ${x.w} missed` : ''}</p>${pad}`);

function initPad() {
  const c = $('#pad'); if (!c) return;
  const ctx = c.getContext('2d'); ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#000';
  let down = false, last = null;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { down = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(last[0] + 0.1, last[1]); ctx.stroke(); });
  c.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  ['pointerup', 'pointercancel'].forEach(t => c.addEventListener(t, () => { down = false; }));

/* ============ STUDY ============ */
let SESS = null, QZ = null, LQ = null;

function viewStudy() {

/* ---------- flashcards ---------- */
function cardSetup() {
  const c = UI.cfg, due = dueList(c.deck).length, nw = newList(c.deck).length;
  return `<div class="card setup"><h2>Flashcard session</h2>
    <p class="lab">Deck</p>${chipRow([['all', 'Everything']].concat(DECK_ORDER.map(k => [k, DECKS[k].label])), c.deck, 'cfg.deck')}
    <p class="lab">What to study</p>${chipRow([['mix', 'Due, then new'], ['due', 'Only due'], ['new', 'Only new']], c.mode, 'cfg.mode')}

function newCardState() {

}
function backHTML(it, dir) {
  const g = dir === 'rev' ? `<div class="big ${isKana(it) || it.type === 'j' ? 'glyph' : 'txt'}">${esc(it.ch)}</div>` : '';
  let d;
  if (isKana(it)) d = `<p class="rom">${esc(it.ro)}</p><p class="muted">${it.type === 'h' ? 'Katakana' : 'Hiragana'}: <span class="glyph">${esc(it.type === 'h' ? toKata(it.ch) : toHira(it.ch))}</span></p>`;

  const b = g === 1 ? Math.max(1, x.b) : Math.min(5, x.b + (g === 3 ? 2 : 1));
  const d = g === 1 ? Math.max(1 / 24, GAP[b] * 0.5) : GAP[b];
  return d < 1 ? '1 h' : (d < 2 ? Math.round(d * 10) / 10 : Math.round(d)) + (d <= 1 ? ' day' : ' days');
}
function sessHTML() {
  if (SESS.done) {
    const gain = today().xp - SESS.xp0, acc = pct(SESS.good, SESS.graded);
    return `<div class="card done"><p class="eyebrow">Session complete</p><h2>Nice work</h2>
      <div class="stats3"><div><b>${SESS.graded}</b><span>cards rated</span></div><div><b>${acc}%</b><span>remembered</span></div><div><b>+${gain}</b><span>XP</span></div></div>

  const front = dir === 'fwd' ? frontBig + `<p class="muted">${isKana(it) ? 'How is it read?' : 'What does it mean?'}</p>`

  return `<div class="sess"><div class="sbar"><div class="prog"><i style="width:${(SESS.i / SESS.q.length * 100).toFixed(1)}%"></i></div><span>${SESS.i + 1} / ${SESS.q.length}</span><button class="link" data-act="endSess">End session</button></div>
    <div class="flash" style="--c:var(${colorOf(it)})">
      <p class="eyebrow"><span class="dotc"></span>${codeOf(it)} · ${TYPE_NAME[it.type]}${isNew ? ' · New' : ''}</p>
      ${front}
      ${SESS.reveal ? `<hr>${backHTML(it, dir)}<button class="ibtn sp" data-act="say" data-id="${esc(id)}" aria-label="Listen">${SPEAK_SVG}</button>` : `<button class="btn lg" data-act="flip">Show answer <kbd>Space</kbd></button>`}
    </div>
    ${SESS.reveal ? `<p class="muted ctr">${isNew ? 'New item. Study it, then rate it.' : 'How well did you remember it?'}</p><div class="grades">
      ${[['Again', 0], ['Hard', 1], ['Good', 2], ['Easy', 3]].map(g => `<button class="gbtn g${g[1]}" data-act="grade" data-g="${g[1]}"><b>${g[0]}</b><span>${nextHint(id, g[1])}</span><kbd>${g[1] + 1}</kbd></button>`).join('')}</div>` : ''}</div>`;

ACT.startCards = () => {
  const c = UI.cfg, due = dueList(c.deck), nw = newList(c.deck);
  let q = c.mode === 'due' ? due : c.mode === 'new' ? nw : due.concat(nw);
  q = q.slice(0, +c.size);
  if (!q.length) { toast(c.mode === 'due' ? 'Nothing is due in this deck yet' : 'Nothing to study with these settings'); return; }
  SESS = { q: q.map(i => i.id), i: 0, reveal: false, dir: 'fwd', graded: 0, good: 0, newCount: 0, xp0: today().xp, done: false };
  newCardState(); render();
};
ACT.flip = () => { if (SESS && !SESS.reveal) { SESS.reveal = true; render(); } };
ACT.grade = el => {
  if (!SESS || !SESS.reveal || SESS.done) return;
  const g = +el.dataset.g, id = SESS.q[SESS.i];
  const wasNew = grade(id, g);
  SESS.graded++; if (g > 0) SESS.good++; if (wasNew) SESS.newCount++;
  g === 0 ? sfx.no() : sfx.ok();
  if (g === 0) SESS.q.splice(Math.min(SESS.q.length, SESS.i + 4), 0, id);
  SESS.i++;
  if (SESS.i >= SESS.q.length) { SESS.done = true; sfx.win(); } else newCardState();
  render();
};
ACT.endSess = () => { SESS = null; render(); };

/* ---------- quiz ---------- */
const QDECKS = [['hira', 'Hiragana'], ['kata', 'Katakana'], ['kana', 'Both kana'], ['kanji', 'Kanji'], ['vocab', 'Vocabulary'], ['phrase', 'Phrases']];
const quizPool = deck => deck === 'kana' ? KANA : DECKS[deck].items;
function quizSetup() {
  const q = UI.quiz, canRead = q.deck === 'kanji' || q.deck === 'vocab';
  return `<div class="card setup"><h2>Multiple-choice quiz</h2>
    <p class="lab">Topic</p>${chipRow(QDECKS, q.deck, 'quiz.deck')}
    <p class="lab">Question style</p>${chipRow([['mixed', 'Mixed'], ['fwd', 'See it, pick the answer'], ['rev', 'See the answer, pick it']].concat(canRead ? [['read', 'Readings']] : []), (q.dir === 'read' && !canRead) ? 'mixed' : q.dir, 'quiz.dir')}

    <button class="btn lg" data-act="startQuiz">Start quiz</button></div>`;
}
function readingsOf(it) { return it.type === 'j' ? it.on.concat(it.kun) : [it.rd]; }
function buildQuestion(it, pool, dir) {
  const kana = isKana(it);
  if (dir === 'read' && !(it.type === 'j' || (it.type === 'v' && it.rd !== it.ch))) dir = Math.random() < 0.5 ? 'fwd' : 'rev';
  let correct, label, cands, show, ask;
  if (dir === 'fwd') { correct = answerOf(it); cands = pool.map(answerOf); ask = kana ? 'How is this read?' : 'What does this mean?'; show = it.ch; }

G.drop = function (st) {
  const pool = kanaPool(), H = 380;
  st.innerHTML = `<div class="ghud"><span>Lives <b id="dl">3</b></span><span>Score <b id="ds">0</b></span><span>Level <b id="dv">1</b></span></div>

  const stage = $('#dst', st), inp = $('#din', st);
  let items = [], lives = 3, score = 0, cleared = 0, lv = 1, spawnT = 0.3, lastT = performance.now(), raf = 0, over = false; const missed = new Set();
  const hud = () => { $('#dl', st).textContent = lives; $('#ds', st).textContent = score; $('#dv', st).textContent = lv; };
  const spawn = () => {
    const it = pool[rnd(pool.length)], el = document.createElement('span'); el.className = 'fall glyph'; el.textContent = it.ch;
    el.style.left = (10 + rnd(Math.max(1, stage.clientWidth - 70))) + 'px'; stage.appendChild(el); items.push({ it, el, y: -50 });
  };
  const end = () => { over = true; cancelAnimationFrame(raf); GAME = null; finishGame('drop', score, [[cleared, 'cleared'], [lv, 'level reached'], [missed.size, 'missed']], Array.from(missed), Math.round(score / 12)); };
  const tick = now => {
    if (over) return;
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.8, 2.3 - lv * 0.17); }
    const v = 45 + lv * 9;
    items.forEach(o => { o.y += v * dt; o.el.style.transform = 'translateY(' + o.y + 'px)'; });
    items.filter(o => o.y > H - 46).forEach(o => { o.el.remove(); items.splice(items.indexOf(o), 1); lives--; missed.add(o.it.id); touch(o.it.id, false); sfx.no(); });

/* ---- Sentence Builder ---- */
G.build = function (st) {
  const order = sample(SENTENCES, 8); let ri = 0, score = 0, first = 0;
  GAME = { stop: () => { st.onclick = null; } };
  function round() {
    const jp = order[ri][0], en = order[ri][1], toks = jp.split('|');
    let bank = shuffle(toks.map((t, i) => ({ t, i })));
    while (toks.length > 1 && bank.every((b, k) => b.i === k)) bank = shuffle(bank);
    let ans = [], tries = 0, hints = 0, busy = false;
    const draw = () => {
      $('#bans', st).innerHTML = ans.length ? ans.map((a, p) => `<button class="tok on" data-a="${p}">${esc(a.t)}</button>`).join('') : '<span class="muted">Tap the words below in order</span>';
      $('#bbank', st).innerHTML = bank.map(b => `<button class="tok" data-b="${b.i}">${esc(b.t)}</button>`).join('');
    };
    const msg = t => { $('#bmsg', st).textContent = t; };
    const advance = () => { ri++; if (ri >= order.length) { GAME = null; finishGame('build', score, [[first, 'first try'], [order.length, 'sentences'], [score, 'points']], [], Math.round(score / 35)); } else round(); };
    st.innerHTML = `<div class="ghud"><span>Round <b>${ri + 1}/${order.length}</b></span><span>Score <b>${score}</b></span></div>
      <div class="card"><p class="eyebrow">Say this in Japanese</p><p class="rom">${esc(en)}</p><div class="ans" id="bans"></div><div class="bank" id="bbank"></div>
      <div class="row"><button class="btn" data-g="chk">Check</button><button class="btn ghost" data-g="hint">Hint (−30)</button><button class="btn ghost" data-g="skip">Skip</button></div><p class="hint" id="bmsg" aria-live="polite"></p></div>`;
    draw();
    st.onclick = e => {
      if (busy) return;
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.b != null) { const i = +t.dataset.b, k = bank.findIndex(b => b.i === i); if (k >= 0) { ans.push(bank.splice(k, 1)[0]); sfx.tick(); draw(); } }
      else if (t.dataset.a != null) { const p = +t.dataset.a; bank.push(ans.splice(p, 1)[0]); draw(); }
      else if (t.dataset.g === 'hint') {
        if (ans.some((a, p) => a.i !== p)) { bank = bank.concat(ans); ans = []; }
        const k = bank.findIndex(b => b.i === ans.length); if (k >= 0) { ans.push(bank.splice(k, 1)[0]); hints++; draw(); }
      } else if (t.dataset.g === 'skip') { busy = true; msg('Answer: ' + jp.replace(/\|/g, ' ')); fails_(); setTimeout(advance, 1600); }
      else if (t.dataset.g === 'chk') {
        if (ans.map(a => a.t).join('|') === jp) {

G.bolt = function (st) {
  const pool = KANA.filter(i => i.group === 'basic').concat(KANJI, VOCAB);
  let left = 30, score = 0, ok = 0, miss = 0, combo = 0, bestCombo = 0, cur = null, truth = true; const missed = new Set();
  st.innerHTML = `<div class="ghud"><span>Time <b id="bt">30</b></span><span>Score <b id="bs">0</b></span><span>Streak <b id="bc">0</b></span></div>
    <div class="card bolt"><div id="bq"></div></div>
    <div class="row ctr"><button class="btn bad-b" data-v="0">False <kbd>←</kbd></button><button class="btn ok-b" data-v="1">True <kbd>→</kbd></button></div>
    <p class="hint ctr" id="bh">Does the answer match the character?</p>`;
  const hud = () => { $('#bt', st).textContent = left; $('#bs', st).textContent = score; $('#bc', st).textContent = combo; };
  const ask = () => {
    const it = pool[rnd(pool.length)]; cur = it; truth = Math.random() < 0.5;
    let shown = answerOf(it);
    if (!truth) { const alt = pool.filter(o => o.type === it.type && o.id !== it.id && answerOf(o) !== shown && (!it.cat || o.cat === it.cat)); const o2 = alt.length ? alt[rnd(alt.length)] : pool.find(o => o.type === it.type && answerOf(o) !== shown); shown = answerOf(o2); }
    const g = isKana(it) || it.type === 'j';
    $('#bq', st).innerHTML = `<div class="big ${g ? 'glyph' : 'txt'}">${esc(it.ch)}</div><p class="rom">${esc(shown)}</p>`;
  };
  const answer = v => {
    if (left <= 0) return;
    const right = (v === truth);
    touch(cur.id, right);
    if (right) { ok++; combo++; bestCombo = Math.max(bestCombo, combo); score += 10 + Math.min(combo, 10); sfx.tick(); $('#bh', st).textContent = ''; }
    else { miss++; combo = 0; score = Math.max(0, score - 5); missed.add(cur.id); sfx.no(); $('#bh', st).textContent = truth ? 'That was correct: ' + answerOf(cur) : 'That was wrong. It is ' + answerOf(cur); }
    hud(); ask();
  };
  st.onclick = e => { const b = e.target.closest('[data-v]'); if (b) answer(b.dataset.v === '1'); };
  const key = e => { if (e.key === 'ArrowRight' || e.key === 't' || e.key === 'T') { e.preventDefault(); answer(true); } else if (e.key === 'ArrowLeft' || e.key === 'f' || e.key === 'F') { e.preventDefault(); answer(false); } };
  document.addEventListener('keydown', key);
  const tm = setInterval(() => { left--; hud(); if (left <= 0) { clearInterval(tm); document.removeEventListener('keydown', key); GAME = null; finishGame('bolt', score, [[ok, 'correct'], [pct(ok, ok + miss) + '%', 'accuracy'], [bestCombo, 'best streak']], Array.from(missed), Math.round(score / 12)); } }, 1000);
  GAME = { stop: () => { clearInterval(tm); document.removeEventListener('keydown', key); } };
  ask(); hud();
};

      <p class="muted">${tot.all} answers given · ${S.games} games played · ${Object.keys(S.lessons).length} of ${LESSONS.length} lessons</p></div></div>
    <div class="card"><h2>Badges <span class="muted small">${earned} of ${ACH.length}</span></h2><div class="badges">${ACH.map(a => `<div class="badge${S.ach[a[0]] ? ' on' : ''}"><b>${esc(a[1])}</b><span>${esc(a[2])}</span></div>`).join('')}</div></div>
    <div class="card"><h2>Best game scores</h2><ul class="plain scores">${GAMES.map(x => `<li><span>${x[1]}</span><b>${S.best[x[0]] || 0}</b></li>`).join('')}</ul></div>

    <div class="card"><h2>Settings</h2>
      <p class="lab">Daily goal</p><div class="chips">${[20, 30, 50, 100].map(v => `<button class="chip${set.goal === v ? ' on' : ''}" data-act="setPref" data-k="goal" data-v="${v}" aria-pressed="${set.goal === v}">${v} XP</button>`).join('')}</div>
      <p class="lab">Character style</p><div class="chips">${[['klee', 'Textbook'], ['gothic', 'Gothic'], ['mincho', 'Mincho']].map(f => `<button class="chip${set.font === f[0] ? ' on' : ''}" data-act="setPref" data-k="font" data-v="${f[0]}" aria-pressed="${set.font === f[0]}">${f[1]} <span class="glyph">あ漢</span></button>`).join('')}</div>
      <p class="lab">Theme</p><div class="chips">${[['system', 'Match device'], ['light', 'Light'], ['dark', 'Dark']].map(f => `<button class="chip${set.theme === f[0] ? ' on' : ''}" data-act="setPref" data-k="theme" data-v="${f[0]}" aria-pressed="${set.theme === f[0]}">${f[1]}</button>`).join('')}</div>
      <p class="lab">Options</p><div class="chips">
        ${[['romaji', 'Show romaji in tables'], ['sound', 'Sound effects'], ['speak', 'Spoken Japanese']].map(f => `<button class="chip${set[f[0]] ? ' on' : ''}" data-act="togglePref" data-k="${f[0]}" aria-pressed="${set[f[0]]}">${f[1]}</button>`).join('')}</div>
      <p class="muted small">Spoken Japanese uses your browser’s voices. If you hear nothing, install a Japanese voice in your device settings.</p></div>

    <div class="card"><h2>Backup and restore</h2><p class="muted" id="syncnote">${CLOUD.status === 'synced' ? '<b>Synced.</b> Your progress is also kept in your account, so it follows you across devices.' : '<b>This browser only.</b> Your progress is saved on this device. Account sync was not available for this visit.'}</p><p class="muted">You can also move progress by hand: create a backup code, copy it, and paste it into the same page on another device.</p>
      <div class="row"><button class="btn" data-act="mkBackup">Create backup code</button>${PR.code ? '<button class="btn ghost" data-act="cpBackup">Copy code</button>' : ''}</div>
      ${PR.code ? `<label class="vh" for="bkout">Backup code</label><textarea id="bkout" class="anout" readonly rows="3">${esc(PR.code)}</textarea>` : ''}
      <label class="lab" for="bkin">Restore from a code</label><textarea id="bkin" class="anout" rows="3" placeholder="Paste a backup code here"></textarea>
      <div class="row"><button class="btn ghost" data-act="rsBackup">Restore</button><span class="muted small" id="rsmsg">${esc(PR.restoreMsg)}</span></div>
      <hr><h3>Start over</h3>${PR.confirm ? `<p class="fb bad">This erases all progress, badges and settings in this browser.</p><div class="row"><button class="btn danger" data-act="resetDo">Erase everything</button><button class="btn ghost" data-act="resetNo">Keep my progress</button></div>`
        : '<button class="btn ghost" data-act="resetAsk">Reset all progress</button>'}</div></section>`;
}
ACT.setPref = el => { const k = el.dataset.k, v = el.dataset.v; S.set[k] = k === 'goal' ? +v : v; applyPrefs(); save(); refreshChips(); render(); };
ACT.togglePref = el => { S.set[el.dataset.k] = !S.set[el.dataset.k]; save(); render(); };
ACT.mkBackup = () => { try { PR.code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { PR.code = ''; toast('Could not create a code'); } render(); };
ACT.cpBackup = () => copyText(PR.code);
ACT.rsBackup = () => {
  const t = ($('#bkin') || {}).value || '';
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
    if (!o || typeof o !== 'object' || !o.items || !o.set) throw new Error('shape');
    S = Object.assign(DEF(), o); S.set = Object.assign(DEF().set, o.set); S.tot = Object.assign(DEF().tot, o.tot || {});
    save(); applyPrefs(); PR.restoreMsg = 'Restored.'; PR.code = ''; refreshChips(); render(); toast('Progress restored');
  } catch (e) { PR.restoreMsg = 'That code could not be read. Check that you copied all of it.'; const m = $('#rsmsg'); if (m) m.textContent = PR.restoreMsg; }
};
ACT.resetAsk = () => { PR.confirm = true; render(); };
ACT.resetNo = () => { PR.confirm = false; render(); };
ACT.resetDo = () => { S = DEF(); save(); PR.confirm = false; PR.code = ''; SESS = null; QZ = null; applyPrefs(); refreshChips(); render(); toast('Progress erased'); };

/* ============ ACCOUNT SYNC (optional) ============ */
/* Browser storage stays the primary copy. When the viewer's private store is reachable, progress is mirrored there. */
const CLOUD = { ref: null, status: 'local', timer: 0, busy: false, dirty: false };
async function cloudInit() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const db = await c.use('db'), user = await c.use('user');
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    CLOUD.ref = db.doc('data/users/' + id + '/progress');
    const snap = await CLOUD.ref.get(), d = snap.exists ? snap.data() : null;
    if (d && typeof d.json === 'string' && (d.savedAt || 0) > (S.saved || 0)) {
      const o = JSON.parse(d.json);
      if (o && o.items && o.set) {
        S = Object.assign(DEF(), o); S.set = Object.assign(DEF().set, o.set); S.tot = Object.assign(DEF().tot, o.tot || {}); S.saved = d.savedAt;
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        applyPrefs(); refreshChips(); if (!SESS && !QZ && !GAME) render(); toast('Progress loaded from your account');
      }
    } else if (!d || (S.saved || 0) > (d.savedAt || 0)) CLOUD.dirty = true;
    CLOUD.status = 'synced';
    if (CLOUD.dirty) cloudPush(); else if (route() === 'progress' && !SESS) render();
  } catch (e) { CLOUD.status = 'local'; }
}
function cloudDirty() {
  if (!CLOUD.ref) return;
  CLOUD.dirty = true; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 4000);
}
async function cloudPush() {
  if (!CLOUD.ref || CLOUD.busy || !CLOUD.dirty) return;
  CLOUD.busy = true; CLOUD.dirty = false;
  try { await CLOUD.ref.set({ json: JSON.stringify(S), savedAt: S.saved || Date.now() }); CLOUD.status = 'synced'; }
  catch (e) { CLOUD.status = 'local'; CLOUD.dirty = false; }
  CLOUD.busy = false;
  if (CLOUD.dirty) cloudDirty();
}

/* ============ MAIN ============ */
const VIEWS = { today: viewToday, dex: viewDex, study: viewStudy, games: viewGames, anki: viewAnki, progress: viewProgress };
let lastRoute = null;
function render() {
  stopGame();
  const r = route(), y = window.scrollY;
  $('#view').innerHTML = VIEWS[r]();
  $$('.nav a').forEach(a => { const on = a.dataset.r === r; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  refreshChips();
  window.scrollTo(0, r === lastRoute ? y : 0); lastRoute = r;
}

ACT.ui = el => {
  const k = el.dataset.k, v = el.dataset.v, parts = k.split('.');
  let o = UI; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = /^\d+$/.test(v) ? +v : v;
  if (k === 'dex') UI.dexQ = '';
  if (k === 'an.deck') AN.out = '';
  if (k === 'study' && v !== 'lessons') UI.lesson = null;
  render();
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.input === 'dexq') { UI.dexQ = t.value; const l = $('#dexlist'); if (l) l.innerHTML = dexList(); }
});
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (route() !== 'study') return;
  if (UI.study === 'cards' && SESS && !SESS.done) {
    if (!SESS.reveal && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ACT.flip(); }
    else if (SESS.reveal && ['1', '2', '3', '4'].indexOf(e.key) >= 0) ACT.grade({ dataset: { g: String(+e.key - 1) } });
  } else if (UI.study === 'quiz' && QZ && !QZ.done) {
    if (QZ.sel == null && ['1', '2', '3', '4'].indexOf(e.key) >= 0 && +e.key <= QZ.qs[QZ.i].opts.length) ACT.qans({ dataset: { i: String(+e.key - 1) } });
    else if (QZ.sel != null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACT.qnext(); }
  }
});
window.addEventListener('hashchange', render);

loadState(); applyPrefs();
try { speechSynthesis.getVoices(); } catch (e) {}
render();
cloudInit();

</script>
